kind = "web"
previewPath = "/"
title = "Minimal Single-Page Website"
version = "1.0.0"
id = "artifacts/minimal-single-page"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23378

[services.development]
run = "pnpm --filter @workspace/minimal-single-page run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/minimal-single-page", "run", "build" ]
serve = "static"
publicDir = "artifacts/minimal-single-page/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23378"
BASE_PATH = "/"
