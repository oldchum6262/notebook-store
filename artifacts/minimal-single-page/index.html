<!DOCTYPE html>
<html lang="en">
  <head>  
    <link rel="stylesheet" href="style.css">
    
  </head>
  <body>
  <!-- 1. The outer frame container  -->
    <div class="notebook-card">
      <!-- THE WISHLIST HEART TOGGLE -->
      <input type="checkbox" id="wishlist-1" class="secret-checkbox" />
      <label for="wishlist-1" class="heart-badge" title="Add to Wishlist">&#9825;</label>


  <!--  2. The Product Image   -->
      <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400" alt="Classic Leather Journal" class="notebook-img"/> 

  <!--  3. The Text Container   -->
      <div class="card-body">
      <h2 class="notebook-title">Classic Leather Journal</h2>
      <p class="notebook-description">Handcrafted lay-flat notebook with 100gsm acid-free dot grid paper.         </p>

  <!-- 4. Price and Action Footer   -->
        <div class="card-footer">
          <span class="notebook-price">$24.00</span>
            <a href="#" class="buy-button">View Details</a>
        </div>
      </div>
    </div>
 
  
  </body>
</html>
